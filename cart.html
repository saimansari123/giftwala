<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | GiftWALA</title><link rel="icon" type="image/png" href="/assets/giftwala-favicon-512.png"><style>
:root{--gold:#dfa532;--ink:#171513;--cream:#fffaf2;--line:#e6d8c5}*{box-sizing:border-box}body{margin:0;background:#41394b;color:var(--ink);font:14px Arial,sans-serif}.cart-page{width:min(760px,100%);margin:0 auto;background:#fff;min-height:100vh}.head{padding:28px 32px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h1{font:32px Georgia;margin:0}.head a{color:#a66d17;text-decoration:none;font-size:12px}.content{padding:24px 32px}.items{border:1px solid var(--line);margin-bottom:22px}.item{display:flex;gap:14px;padding:16px;border-bottom:1px solid var(--line);align-items:center}.item:last-child{border:0}.item img{width:72px;height:72px;object-fit:cover;background:#f3eee6}.item h3{font-size:14px;margin:0 0 7px}.item p{margin:0;color:#766c60;font-size:12px}.empty{text-align:center;padding:48px;color:#83776c}.pay{border:1px solid var(--gold);margin:14px 0 18px}.pay label{display:flex;gap:12px;align-items:center;padding:16px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-weight:600}.pay label:last-child{border:0}.pay input{appearance:none;width:16px;height:16px;border:1px solid #bd7d12;border-radius:50%;margin:0}.pay input:checked{box-shadow:inset 0 0 0 4px #fff;background:var(--gold)}.note{background:#fff8e8;border-left:3px solid var(--gold);padding:13px 14px;color:#765c30;font-weight:600;margin-bottom:16px}.action{display:block;width:100%;border:0;background:var(--gold);padding:16px;font-weight:bold;font-size:14px;cursor:pointer}.bill{margin-top:20px}.line{display:flex;justify-content:space-between;padding:12px 0}.discount{color:#168653;font-weight:700}.total{font-size:18px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:17px}@media(max-width:500px){.head,.content{padding-left:20px;padding-right:20px}}
</style></head><body><div class="cart-page"><div class="head"><h1>Your bag <span id="count" style="font:14px Arial;color:#b47d1d">(0)</span></h1><a href="/">← Continue shopping</a></div><div class="content"><div class="items" id="items"></div><div class="pay"><label><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label><input type="radio" name="payment" value="Easypaisa"> Easypaisa - 15% off prepaid</label><label><input type="radio" name="payment" value="JazzCash"> JazzCash - 15% off prepaid</label><label><input type="radio" name="payment" value="Bank Transfer"> Bank Transfer - 15% off prepaid</label></div><div class="note" id="note">Pay cash when your order is delivered.</div><button class="action" id="checkout">Checkout via WhatsApp</button><div class="bill"><div class="line discount"><span>Prepaid discount</span><strong id="discount">Rs. 0</strong></div><div class="line"><span>Delivery charges</span><strong>Rs. 250</strong></div><div class="line total"><span>Total</span><strong id="total">Rs. 250</strong></div></div></div></div><script>
const cart=JSON.parse(localStorage.getItem('giftwala_checkout_cart')||localStorage.getItem('giftwalaCart')||'[]'),money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK'),items=document.getElementById('items'),base=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||x.quantity||1),0);document.getElementById('count').textContent='('+cart.reduce((s,x)=>s+Number(x.qty||x.quantity||1),0)+')';items.innerHTML=cart.length?cart.map(x=>`<div class="item"><img src="${x.imageUrl||'/assets/brand/giftwala-favicon-512.png'}"><div><h3>${x.name||'Gift item'}</h3><p>Qty ${x.qty||x.quantity||1} · ${money(Number(x.price||0)*Number(x.qty||x.quantity||1))}</p></div></div>`).join(''):'<div class="empty">Your bag is waiting for something lovely.</div>';function refresh(){const p=document.querySelector('input[name=payment]:checked').value,save=p==='Cash on Delivery'?0:Math.round(base*.15);document.getElementById('discount').textContent=save?'− '+money(save):'Rs. 0';document.getElementById('total').textContent=money(base-save+250);document.getElementById('note').textContent=p==='Cash on Delivery'?'Pay cash when your order is delivered.':'Payment details will be confirmed on WhatsApp.'}document.querySelectorAll('input[name=payment]').forEach(x=>x.onchange=refresh);refresh();document.getElementById('checkout').onclick=()=>{localStorage.setItem('giftwala_checkout_cart',JSON.stringify(cart));location.href='/checkout.html'};
</script></body></html>
