<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Shop | GiftWALA</title><link rel="stylesheet" href="styles.css"><style>.all-shop{padding:70px 10%}.all-shop h1{font:600 48px 'Playfair Display';margin:10px 0 30px}.all-shop .product-grid{margin-top:25px}.all-shop .product-image img{width:100%;height:100%;object-fit:cover}.all-shop .product-card{cursor:pointer}@media(max-width:850px){.all-shop{padding:45px 8%}.all-shop h1{font-size:36px}}</style></head><body><div class="announcement">Free delivery on orders above Rs. 2,500 <span>-</span> Made with love in Pakistan</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark"><i></i><b>G</b></span><span><strong>Gift<span>WALA</span></strong><small>CUSTOMIZED GIFTS &amp; ACCESSORIES</small></span></a><nav class="desktop-nav"><a href="/">Home</a><a class="nav-highlight" href="/all-shop.html">All Shop</a><a href="/customize.html">Build your box</a><a href="/categories.html">Categories</a><a href="/how-it-works.html">How it works</a><a href="/reviews.html">Reviews</a><a href="/about.html">About</a><a href="/contact.html">Contact</a></nav><a class="text-link" href="/">Home -></a></header><main class="all-shop"><p class="eyebrow">THE GIFTWALA COLLECTION</p><h1>All products</h1><div id="products" class="product-grid"><p>Loading products...</p></div></main><script>const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');fetch('/api/products').then(r=>r.json()).then(ps=>{document.getElementById('products').innerHTML=ps.map(p=>{const sku=p.sku||'';const ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png';return '<article class="product-card" onclick="location.href=\'/product.html?id='+encodeURIComponent(sku)+'\'"><div class="product-image"><img loading="lazy" src="/assets/products/'+sku+ext+'" alt="'+p.name+'"></div><div class="product-info"><h3>'+p.name+'</h3><p>'+ (p.description||'Thoughtfully selected
