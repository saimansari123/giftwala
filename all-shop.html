<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>All Shop | GiftWALA</title>
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/giftwala-favicon-512.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .all-shop { padding: 70px 10%; max-width: 1400px; margin: 0 auto; }
    .category-header { margin-bottom: 40px; }
    .category-header h1 { font: 600 48px 'Playfair Display'; margin: 20px 0 15px; }
    .category-header p { color: #817970; font-size: 15px; line-height: 1.6; max-width: 700px; margin: 0 0 12px; }
    .category-info { color: #aaa095; font-size: 13px; font-weight: 500; }
    .all-shop h1 { font: 600 48px 'Playfair Display'; margin: 10px 0 30px; }
    .all-shop .product-grid { margin-top: 25px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .all-shop .product-card { cursor: pointer; }
    .all-shop .product-image { width: 100%; height: 280px; overflow: hidden; background: #f5f1eb; }
    .all-shop .product-image img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.3s; }
    .all-shop .product-card:hover .product-image img { transform: scale(1.05); }
    .skeleton { background: linear-gradient(90deg, #f5f1eb 25%, #e8e1d8 50%, #f5f1eb 75%); background-size: 200% 100%; animation: load 1.5s infinite; }
    @keyframes load { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skeleton-card { display: flex; flex-direction: column; height: 100%; }
    .skeleton-img { width: 100%; height: 280px; border-radius: 8px; }
    .skeleton-text { flex: 1; padding: 16px 0; display: flex; flex-direction: column; gap: 8px; }
    .skeleton-title { height: 20px; border-radius: 4px; }
    .skeleton-desc { height: 40px; border-radius: 4px; }
    .skeleton-price { height: 18px; width: 60%; border-radius: 4px; }
    @media(max-width:1000px) { .all-shop .product-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; } }
    @media(max-width:850px) {
      .all-shop { padding: 45px 8%; }
      .all-shop h1 { font-size: 36px; }
      .all-shop .product-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .all-shop .product-image { height: 200px; }
    }
    @media(max-width:520px) {
      .all-shop { padding: 30px 5%; }
      .all-shop h1 { font-size: 28px; }
      .all-shop .product-grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="announcement">Free delivery on orders above Rs. 3,000 • Made with love in Pakistan</div>
  <header class="site-header"></header>

  <main class="all-shop">
    <p class="eyebrow">THE GIFTWALA COLLECTION</p>
    <div class="category-header" id="category-header" style="display:none;">
      <h1 id="category-name"></h1>
      <p id="category-desc"></p>
      <div class="category-info"><span id="product-count"></span> products</div>
    </div>
    <h1 id="page-title">All products</h1>
    <div id="products" class="product-grid">
      <p>Loading products...</p>
    </div>
  </main>

  <script src="/header-sync.js"></script>
  <script>
    const money = n => 'Rs. ' + Number(n || 0).toLocaleString('en-PK');
    const category = new URLSearchParams(location.search).get('category');
    const search = new URLSearchParams(location.search).get('search');
    const box = document.getElementById('products');
    const title = document.getElementById('page-title');
    const catHeader = document.getElementById('category-header');
    const catName = document.getElementById('category-name');
    const catDesc = document.getElementById('category-desc');
    const catCount = document.getElementById('product-count');

    // Show skeleton loaders immediately
    function showSkeletons(count = 8) {
      box.innerHTML = Array(count).fill(0).map(() => `
        <div class="skeleton-card">
          <div class="skeleton skeleton-img"></div>
          <div class="skeleton-text">
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-desc"></div>
            <div class="skeleton skeleton-price"></div>
          </div>
        </div>
      `).join('');
    }

    // Show skeletons immediately on page load
    showSkeletons();

    function renderProducts(ps) {
      let filtered = ps;

      if (search) {
        const term = search.toLowerCase();
        filtered = ps.filter(p =>
          (p.name + ' ' + (p.category || '') + ' ' + (p.description || '')).toLowerCase().includes(term)
        );
        title.textContent = 'Search: ' + search;
        catHeader.style.display = 'none';
      } else if (category && category !== 'All') {
        filtered = ps.filter(p => String(p.category || '').trim().toLowerCase() === category.trim().toLowerCase());
        title.style.display = 'none';
        catHeader.style.display = 'block';
        catName.textContent = category;
        catDesc.textContent = 'Premium personalised gifts and thoughtful accessories from GiftWALA collection.';
        catCount.textContent = filtered.length;
      } else {
        catHeader.style.display = 'none';
      }

      if (!filtered.length) {
        box.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">No products found.</p>';
        return;
      }

      box.innerHTML = filtered.map(p => {
        const sku = p.sku || '';
        const ext = (p.imageName || '').toLowerCase().endsWith('.jpg') ? '.jpg' : '.png';
        const mainImg = `/assets/products/${sku}${ext}`;
        const cardImg = p.cardImage || '';
        const imageUrl = cardImg || mainImg;
        const sale = Number(p.salePrice || p.price || 0);
        const original = Number(p.price || 0);
        const oldPrice = original > sale ? ` <del class="old-price">${money(original)}</del>` : '';

        return `<article class="product-card" onclick="location.href='/product.html?id=${encodeURIComponent(sku)}'">
          <div class="product-image">
            <img loading="lazy" src="${imageUrl}" alt="${p.name}" onerror="this.src='${mainImg}'">
          </div>
          <div class="product-info">
            <h3>${p.name}</h3>
            <p>${p.description || 'Thoughtfully selected for you.'}</p>
            <b class="price">${money(sale)}${oldPrice}</b>
          </div>
        </article>`;
      }).join('');
    }

    // Try to get from cache first
    let productsCache = localStorage.getItem('giftwala_products_cache');
    let cacheTime = localStorage.getItem('giftwala_cache_time');
    let now = Date.now();

    if (productsCache && cacheTime && (now - parseInt(cacheTime)) < 300000) {
      // Cache is fresh (5 minutes), use it
      try {
        renderProducts(JSON.parse(productsCache));
      } catch (e) {
        // Cache invalid, fetch fresh
        fetch('/api/products').then(r => r.json()).then(data => {
          localStorage.setItem('giftwala_products_cache', JSON.stringify(data));
          localStorage.setItem('giftwala_cache_time', now.toString());
          renderProducts(data);
        }).catch(() => {
          box.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Could not load products.</p>';
        });
      }
    } else {
      // Fetch fresh data
      fetch('/api/products').then(r => r.json()).then(data => {
        localStorage.setItem('giftwala_products_cache', JSON.stringify(data));
        localStorage.setItem('giftwala_cache_time', now.toString());
        renderProducts(data);
      }).catch(() => {
        box.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999;">Could not load products.</p>';
      });
    }
  </script>
</body>
</html>
