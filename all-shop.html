<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Shop | GiftWALA</title><link rel="stylesheet" href="styles.css"><style>.all-shop{padding:70px 10%}.all-shop h1{font:600 48px 'Playfair Display';margin:10px 0 30px}.all-shop .product-grid{margin-top:25px}.all-shop .product-image img{width:100%;height:100%;object-fit:cover}.all-shop .product-card{cursor:pointer}@media(max-width:850px){.all-shop{padding:45px 8%}.all-shop h1{font-size:36px}}</style></head><body><div class="announcement">Free delivery on orders above Rs. 2,500 <span>-</span> Made with love in Pakistan</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark"><i></i><b>G</b></span><span><strong>Gift<span>WALA</span></strong><small>CUSTOMIZED GIFTS &amp; ACCESSORIES</small></span></a><nav class="desktop-nav"><a href="/">Home</a><a class="nav-highlight" href="/all-shop.html">All Shop</a><a href="/customize.html">Build your box</a><a href="/categories.html">Categories</a><a href="/how-it-works.html">How it works</a><a href="/reviews.html">Reviews</a><a href="/about.html">About</a><a href="/contact.html">Contact</a></nav><a class="text-link" href="/">Home -></a></header><main class="all-shop"><p class="eyebrow">THE GIFTWALA COLLECTION</p><h1>All products</h1><div id="products" class="product-grid"><p>Loading products...</p></div></main><script>const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');fetch('/api/products').then(r=>r.json()).then(ps=>{document.getElementById('products').innerHTML=ps.map(p=>{const sku=p.sku||'';const ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png';return '<article class="product-card" onclick="location.href=\'/product.html?id='+encodeURIComponent(sku)+'\'"><div class="product-image"><img loading="lazy" src="/assets/products/'+sku+ext+'" alt="'+p.name+'"></div><div class="product-info"><h3>'+p.name+'</h3><p>'+ (p.description||'Thoughtfully selected for you.')+'</p><b class="price">'+money(p.salePrice||p.price)+'</b></div></article>'}).join('')}).catch(()=>document.getElementById('products').innerHTML='<p>Products could not be loaded.</p>')</script><script src="/header-sync.js"></script></body></html>

<script>document.addEventListener('DOMContentLoaded',()=>{const fix=()=>document.querySelectorAll('.all-shop .product-card').forEach(c=>{c.style.height='500px';c.style.display='flex';c.style.flexDirection='column';const i=c.querySelector('.product-image'),p=c.querySelector('.product-info');if(i){i.style.height='280px';i.style.flex='0 0 280px'}if(p){p.style.height='220px';p.style.minHeight='220px';p.style.display='flex';p.style.flexDirection='column'}const b=c.querySelector('.mobile-add-cart');if(b)b.style.marginTop='auto'});fix();new MutationObserver(fix).observe(document.getElementById('products'),{childList:true})});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const category=new URLSearchParams(location.search).get('category');if(!category||category==='All')return;const box=document.getElementById('products'),title=document.querySelector('.all-shop h1');fetch('/api/products').then(r=>r.json()).then(ps=>{const list=(Array.isArray(ps)?ps:[]).filter(p=>(p.category||'')===category);if(title)title.textContent=category;if(!box)return;box.innerHTML=list.map(p=>{const sku=p.sku||'',ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png',sale=Number(p.salePrice||p.price||0),original=Number(p.price||0),old=original>sale?` <del class="old-price">Rs. ${original.toLocaleString('en-PK')}</del>`:'';return `<article class="product-card" onclick="location.href='/product.html?id=${encodeURIComponent(sku)}'"><div class="product-image"><img loading="lazy" src="/assets/products/${sku}${ext}" alt="${p.name}"></div><div class="product-info"><h3>${p.name}</h3><p>${p.description||'Thoughtfully selected for you.'}</p><b class="price">Rs. ${sale.toLocaleString('en-PK')}${old}</b></div></article>`}).join('')||'<p>No products found in this category.</p>'}).catch(()=>{})});</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const category=new URLSearchParams(location.search).get('category');if(!category||category==='All')return;setTimeout(()=>{fetch('/api/products').then(r=>r.json()).then(ps=>{const list=(Array.isArray(ps)?ps:[]).filter(p=>String(p.category||'').trim().toLowerCase()===category.trim().toLowerCase()),box=document.getElementById('products'),title=document.querySelector('.all-shop h1');if(title)title.textContent=category;if(box)box.innerHTML=list.map(p=>{const sku=p.sku||'',ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png',sale=Number(p.salePrice||p.price||0),original=Number(p.price||0),old=original>sale?` <del class="old-price">Rs. ${original.toLocaleString('en-PK')}</del>`:'';return `<article class="product-card" onclick="location.href='/product.html?id=${encodeURIComponent(sku)}'"><div class="product-image"><img loading="lazy" src="/assets/products/${sku}${ext}" alt="${p.name}"></div><div class="product-info"><h3>${p.name}</h3><p>${p.description||'Thoughtfully selected for you.'}</p><b class="price">Rs. ${sale.toLocaleString('en-PK')}${old}</b></div></article>`}).join('')||'<p>No products found in this category.</p>'})},1200)});</script>
<style id="page-manrope">body,body *{font-family:'Manrope',Arial,sans-serif!important}</style>
<style>.category-intro{max-width:650px;color:#756d62;font-size:16px;line-height:1.6;margin:-12px 0 14px}.category-count{font-weight:700;margin:0 0 18px}</style><script>document.addEventListener('DOMContentLoaded',()=>{const category=new URLSearchParams(location.search).get('category');if(!category||category==='All')return;setTimeout(()=>{const main=document.querySelector('.all-shop'),box=document.getElementById('products'),title=main?.querySelector('h1');if(!main||!box||!title)return;const old=main.querySelector('.category-intro');if(old)old.remove();const intro=document.createElement('p');intro.className='category-intro';intro.textContent='Browse '+category.toLowerCase()+' from GiftWALA with thoughtful, personalization-ready options and gift-ready finishing.';const count=document.createElement('p');count.className='category-count';count.textContent=box.querySelectorAll('.product-card').length+' products';title.before(intro);intro.after(count);const eyebrow=main.querySelector('.eyebrow');if(eyebrow)eyebrow.textContent='SHOP BY COLLECTION'},1400)});</script>
<script>(()=>{const category=new URLSearchParams(location.search).get('category');if(!category||category==='All')return;const run=()=>fetch('/api/products').then(r=>r.json()).then(ps=>{const list=ps.filter(p=>String(p.category||'').trim().toLowerCase()===category.trim().toLowerCase()),box=document.getElementById('products'),title=document.querySelector('.all-shop h1'),eyebrow=document.querySelector('.all-shop .eyebrow');if(title)title.textContent=category;if(eyebrow)eyebrow.textContent='SHOP BY COLLECTION';if(box)box.innerHTML=list.map(p=>{const sku=p.sku||'',ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png',sale=Number(p.salePrice||p.price||0),original=Number(p.price||0),old=original>sale?` <del class="old-price">Rs. ${original.toLocaleString('en-PK')}</del>`:'';return `<article class="product-card" onclick="location.href='/product.html?id=${encodeURIComponent(sku)}'"><div class="product-image"><img loading="lazy" src="/assets/products/${sku}${ext}" alt="${p.name}"></div><div class="product-info"><h3>${p.name}</h3><p>${p.description||'Thoughtfully selected for you.'}</p><b class="price">Rs. ${sale.toLocaleString('en-PK')}${old}</b></div></article>`}).join('')||'<p>No products found in this category.</p>';const intro=document.createElement('p');intro.className='category-intro';intro.textContent='Browse '+category.toLowerCase()+' from GiftWALA with thoughtful, personalization-ready options and gift-ready finishing.';if(title&&!document.querySelector('.category-intro'))title.before(intro)});run();setTimeout(run,1800)})();</script>
<style>.category-page-hero{background:#f2efe7;border-top:1px solid #ddd6ca;border-bottom:1px solid #ddd6ca;padding:46px max(8%,calc((100% - 1380px)/2)) 48px}.category-page-hero .breadcrumb{font-size:13px;color:#756d62;margin:0 0 20px}.category-page-hero .breadcrumb span{margin:0 8px;color:#b47d1d}.category-page-hero .eyebrow{margin-bottom:12px}.category-page-hero h1{font:700 38px/1.1 'Manrope',Arial,sans-serif;margin:0 0 14px;color:#111}.category-page-hero p{max-width:650px;color:#756d62;font-size:16px;line-height:1.55;margin:0 0 16px}.category-page-hero strong{font-size:14px;color:#111}.category-page-mode>.eyebrow,.category-page-mode>h1,.category-page-mode>.category-intro,.category-page-mode>.category-count{display:none!important}.category-page-mode{padding-top:40px!important}@media(max-width:850px){.category-page-hero{padding:30px 8% 34px}.category-page-hero h1{font-size:30px}.category-page-hero p{font-size:14px}}</style><script>(()=>{const category=new URLSearchParams(location.search).get('category');if(!category||category==='All')return;const main=document.querySelector('.all-shop');if(!main)return;const hero=document.createElement('section');hero.className='category-page-hero';hero.innerHTML='<p class="breadcrumb"><a href="/">Home</a><span>/</span>'+category+'</p><p class="eyebrow">SHOP BY COLLECTION</p><h1>'+category+'</h1><p>Browse '+category.toLowerCase()+' from GiftWALA with personalization-ready options and gift-ready finishing.</p><strong class="hero-count">Loading products...</strong>';main.before(hero);main.classList.add('category-page-mode');fetch('/api/products').then(r=>r.json()).then(ps=>{const n=ps.filter(p=>String(p.category||'').trim().toLowerCase()===category.trim().toLowerCase()).length;const c=hero.querySelector('.hero-count');if(c)c.textContent=n+' products'}).catch(()=>{})})();</script>
