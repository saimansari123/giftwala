<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Order | GiftWALA</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site-pages.css"><style>.tracking-card{max-width:620px;margin-top:28px;background:#fff;border:1px solid #e8e1d8;padding:24px}.tracking-card form{display:flex;gap:10px}.tracking-card input{flex:1;padding:13px;border:1px solid #d9cdbc}.tracking-card button{border:0;background:#dba83d;padding:13px 18px;font-weight:700;cursor:pointer}.tracking-result{margin-top:22px;padding:18px;background:#faf7f1;border:1px solid #e8e1d8}.status-pill{display:inline-block;padding:7px 12px;background:#f5dfa8;color:#76500e;text-transform:capitalize;font-weight:700;font-size:12px}@media(max-width:520px){.tracking-card form{display:block}.tracking-card button{width:100%;margin-top:10px}}</style></head><body><div class="announcement">Free delivery on orders above Rs. 2,500 - Made with love in Pakistan</div><header class="site-header"><a class="brand" href="/"></a></header><main class="page-shell"><p class="eyebrow">ORDER SUPPORT</p><h1>Track your <em>order.</em></h1><p>Enter the order ID received after checkout to see the latest delivery status.</p><div class="tracking-card"><form id="trackForm"><input id="orderId" placeholder="Enter order ID" required><button>Track order</button></form><div id="result"></div></div></main><script src="/header-sync.js"></script><script>document.getElementById('trackForm').onsubmit=async e=>{e.preventDefault();const out=document.getElementById('result');out.innerHTML='<p>Loading...</p>';try{const r=await fetch('/api/orders/'+encodeURIComponent(document.getElementById('orderId').value.trim()));const o=await r.json();if(!r.ok)throw Error(o.message||'Order not found');out.innerHTML='<div class="tracking-result"><b>Order '+String(o._id).slice(-8)+'</b><p>Status: <span class="status-pill">'+o.status+'</span></p><p>Total: Rs. '+Number(o.total||0).toLocaleString('en-PK')+'</p></div>'}catch(err){out.innerHTML='<div class="tracking-result">'+err.message+'</div>'}}</script></body></html>
