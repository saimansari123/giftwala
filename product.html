<script>(()=>{const apply=()=>{const d=document.querySelector('.details'),h=d?.querySelector('h1');if(!d||!h)return;const text=(h.textContent+' '+(d.querySelector('.eyebrow')?.textContent||'')).toLowerCase(),custom=/customiz|personaliz|engraved|printed/.test(text),gift=/gift boxes?/.test(text);d.querySelectorAll('.section').forEach(s=>{const label=s.querySelector('.label')?.textContent||'';if(/personalization name/i.test(label))s.style.display=custom?'':'none';if(/choose an occasion card/i.test(label))s.style.display=gift?'':'none'})};apply();const app=document.getElementById('app');if(app)new MutationObserver(apply).observe(app,{childList:true,subtree:true})})();</script>
<script>(()=>{let selected='';const add=()=>{const d=document.querySelector('.details'),e=d?.querySelector('.frame-size-section'),cat=d?.querySelector('.eyebrow')?.textContent||'';if(!d||!/frame/i.test(cat))return;if(e)return;const sizes=(window.p?.sizes?.length?window.p.sizes:['8 x 10 inches','12 x 16 inches','16 x 20 inches']);const box=document.createElement('div');box.className='section frame-size-section';box.innerHTML='<p class="label">Choose frame size</p><div class="options">'+sizes.map((s,i)=>'<button type="button" class="option '+(!i?'active':'')+'" data-size="'+s+'">'+s+'</button>').join('')+'</div>';const note=[...d.querySelectorAll('.section')].find(x=>/gift note/i.test(x.textContent));if(note)note.before(box);else d.appendChild(box);selected=sizes[0];box.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{selected=b.dataset.size;box.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b))})};const t=setInterval(()=>{if(document.querySelector('.details h1')){add();clearInterval(t)}},150);setTimeout(()=>clearInterval(t),10000)})();</script>
<script>(()=>{const ensure=()=>{const d=document.querySelector('.details'),cat=d?.querySelector('.eyebrow')?.textContent||'';if(!d||!/frame/i.test(cat)||d.querySelector('.frame-size-section'))return;const sizes=['8 x 10 inches','12 x 16 inches','16 x 20 inches'],box=document.createElement('div');box.className='section frame-size-section';box.innerHTML='<p class="label">Choose frame size</p><div class="options">'+sizes.map((s,i)=>'<button type="button" class="option '+(!i?'active':'')+'" data-size="'+s+'">'+s+'</button>').join('')+'</div>';const note=[...d.querySelectorAll('.section')].find(x=>/gift note/i.test(x.textContent));if(note)note.before(box);else d.appendChild(box);box.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>box.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b)))};const app=document.getElementById('app');if(app){new MutationObserver(()=>setTimeout(ensure,0)).observe(app,{childList:true,subtree:true});ensure()}})();</script>
<script>(()=>{let q=1;const fix=()=>{const minus=document.getElementById('minus'),plus=document.getElementById('plus'),qtyEl=document.querySelector('.qty span'),total=document.querySelector('.total strong');if(!minus||!plus||!qtyEl||minus.dataset.stable)return;minus.dataset.stable='1';q=Number(qtyEl.textContent)||1;const update=()=>{qtyEl.textContent=q;const price=Number((document.querySelector('.price')?.textContent||'0').replace(/[^0-9]/g,''))||0;const card=document.querySelector('.option.active[data-card]')?50:0;if(total)total.textContent='Rs. '+((price+card)*q).toLocaleString('en-PK')};minus.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();q=Math.max(1,q-1);update()};plus.onclick=e=>{e.preventDefault();e.stopImmediatePropagation();q=Math.min(99,q+1);update()}};const app=document.getElementById('app');if(app)new MutationObserver(()=>setTimeout(fix,0)).observe(app,{childList:true,subtree:true});setInterval(fix,250)})();</script>
