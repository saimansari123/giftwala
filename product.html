<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftWALA Product</title><link rel="stylesheet" href="styles.css"><style>.page{max-width:1180px;margin:auto;padding:55px 7%}.crumb{color:#a66d17;font-size:12px}.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;margin-top:35px}.photo{height:560px;background:#eee7dc;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.copy h1{font:600 48px/1.08 'Playfair Display';margin:12px 0 18px}.copy p{color:#817970;line-height:1.8}.eyebrow{color:#b47d1d;font-size:10px;letter-spacing:.2em;font-weight:700}.rating{color:#b47d1d;margin:16px 0}.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tags span{background:#f8edcf;color:#987025;padding:7px 10px;font-size:10px}.price{font-size:25px;font-weight:700;margin:22px 0}.old{font-size:14px;color:#999;margin-left:10px}.actions{display:flex;gap:10px}.actions button{flex:1}.info,.details{padding:20px;background:#faf7f1;border:1px solid #eee5da;margin-top:20px}.details{grid-column:1/-1;line-height:1.8;color:#71695f}.details h2{font:28px 'Playfair Display';color:#171513}.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.checks div{padding:15px;background:white;font-size:12px}.checks b{display:block;color:#b47d1d;margin-bottom:6px}@media(max-width:850px){.page{padding:35px 7%}.detail{grid-template-columns:1fr;gap:30px}.photo{height:380px}.copy h1{font-size:36px}.checks{grid-template-columns:1fr}.actions{flex-direction:column}}</style></head><body><div class="announcement">Free delivery on orders above Rs. 2,500 <span>•</span> Made with love in Pakistan</div><header class="site-header"><a class="brand" href="/"><span class="brand-mark">G<i></i></span><span><strong>Gift<span>WALA</span></strong><small>CUSTOMIZED GIFTS &amp; ACCESSORIES</small></span></a><a href="/" class="text-link">Back to shop →</a></header><main class="page"><a class="crumb" href="/">← Back to collection</a><div id="app"><p>Loading product…</p></div></main><script>const id=new URLSearchParams(location.search).get('id');const money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');async function load(){try{let p=null;try{const r=await fetch('/api/products/'+encodeURIComponent(id));if(r.ok)p=await r.json()}catch{}if(!p){const all=await fetch('/server/sheet-products.json').then(r=>r.json());p=all.find(x=>x.sku===id)}if(!p)throw Error();const sku=p.sku||id;const ext=(p.imageName||'').toLowerCase().endsWith('.jpg')?'.jpg':'.png';const src=`/assets/products/${sku}${ext}`;document.title=p.name+' | GiftWALA';document.getElementById('app').innerHTML=`<section class="detail"><div class="photo"><img src="${src}" alt="${p.name}"></div><div class="copy"><p class="eyebrow">${p.category||'GIFTWALA COLLECTION'}</p><h1>${p.name}</h1><div class="rating">★★★★★ <span>4.9/5 · Verified buyers</span></div><p>${p.description||'A thoughtful GiftWALA pick, personalised and packed with care.'}</p><div class="tags"><span>${p.category||'Gift Boxes'}</span><span>Gift-ready packing</span><span>Customisable</span></div><div class="price">${money(p.salePrice||p.price)} ${p.salePrice?`<del class="old">${money(p.price)}</del>`:''}</div><p>${p.stock>0?'In stock — ready to gift':'Currently unavailable'}</p><div class="actions"><button class="btn gold" onclick="order()">Buy it now →</button><button class="btn light" onclick="order()">Ask on WhatsApp</button></div><div class="info"><b>Delivery across Pakistan</b><br>Flat Rs. 300 delivery · Cash on delivery available</div></div><div class="details"><h2>Product details</h2><p>${p.description||'Personalised gifts with careful finishing and gift-ready packing.'}</p><div class="checks"><div><b>01 · Personalise</b>Add names, dates or a message.</div><div><b>02 · Approve proof</b>We confirm details before production.</div><div><b>03 · Gift-ready</b>Packed carefully and delivered nationwide.</div></div></div></section>`;window.current=p}catch(e){document.getElementById('app').innerHTML='<p>Product not found. <a href="/">Return to shop</a></p>'}}function order(){const p=window.current;window.open('https://wa.me/923001234567?text='+encodeURIComponent('Hi GiftWALA! I would like to order: '+p.name+' — '+money(p.salePrice||p.price)),'_blank')}load();</script></body></html>

<script>setTimeout(()=>{const p=window.current;if(!p||p.category!=='Frames & Wall Art')return;const copy=document.querySelector('.copy');const price=document.querySelector('.price');if(!copy||!price)return;const box=document.createElement('div');box.className='size-picker';box.innerHTML='<label for="frameSize">Select frame size</label><select id="frameSize"><option value="799">A5 · 5.8 × 8.3 in — Rs. 799</option><option value="999">A4 · 8.3 × 11.7 in — Rs. 999</option><option value="1299">A3 · 11.7 × 16.5 in — Rs. 1,299</option><option value="1599">A2 · 16.5 × 23.4 in — Rs. 1,599</option></select>';copy.insertBefore(box,price);const select=box.querySelector('select');select.onchange=()=>{price.textContent='Rs. '+Number(select.value).toLocaleString('en-PK');window.current.selectedSize=select.options[select.selectedIndex].text};},1200);</script>

<script>setTimeout(()=>{const old=document.getElementById('frameSize');if(!old)return;const wrap=document.createElement('div');wrap.className='custom-size';const button=document.createElement('button');button.type='button';button.textContent=old.options[old.selectedIndex].text;const opts=document.createElement('div');opts.className='custom-options';[...old.options].forEach((o,i)=>{const item=document.createElement('div');item.textContent=o.textContent;if(i===old.selectedIndex)item.className='active';item.onclick=()=>{old.value=o.value;old.dispatchEvent(new Event('change'));button.textContent=o.textContent;opts.querySelectorAll('div').forEach(x=>x.classList.remove('active'));item.classList.add('active');wrap.classList.remove('open')};opts.appendChild(item)});button.onclick=()=>wrap.classList.toggle('open');wrap.append(button,opts);old.style.display='none';old.parentNode.insertBefore(wrap,old);document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open')})},1400);</script>

<script>setTimeout(()=>{const p=window.current,details=document.querySelector('.details');if(!p||!details||document.querySelector('.reviews-section'))return;const cat=(p.category||'').toLowerCase();let reviews;if(cat.includes('frame')||cat.includes('wall'))reviews=[['Ayesha K.','The frame quality is beautiful and the personalised details came out perfectly.'],['Hamza R.','Packaging was secure and delivery was quick. It looks even better in person.'],['Sana M.','A lovely gift for a special memory. Very happy with the finish.']];else if(cat.includes('box')||cat.includes('gift'))reviews=[['Maham A.','Everything was arranged so beautifully. The recipient absolutely loved it.'],['Usman F.','Premium quality products and very neat gift packaging.'],['Hira S.','The gift arrived safely and looked exactly like the pictures.']];else reviews=[['Zoya A.','Beautiful product and excellent finishing. Highly recommended.'],['Ali R.','Very thoughtful and well-packed. The quality exceeded my expectations.'],['Maryam K.','Fast delivery and a lovely gift-ready presentation.']];const section=document.createElement('section');section.className='reviews-section';section.innerHTML='<h2>Customer reviews</h2><div class="review-list">'+reviews.map(r=>'<article class="review-card"><div class="review-stars">★★★★★</div><p>“'+r[1]+'”</p><b>'+r[0]+' · Verified buyer</b></article>').join('')+'</div>';details.append(section)},1900);</script>
