function wireProductReviews(){
  const R=window.GWReviews; if(!R) return;
  const list=document.getElementById('reviewsList'); if(!list) return;
  let sum=document.getElementById('productReviewSummary');
  if(!sum){ sum=document.createElement('div'); sum.id='productReviewSummary'; sum.className='rv-summary'; sum.hidden=true; list.parentNode.insertBefore(sum,list); }
  let empty=document.getElementById('productReviewsEmpty');
  if(!empty){ empty=document.createElement('p'); empty.id='productReviewsEmpty'; empty.className='reviews-empty'; empty.textContent='No verified reviews for this product yet \u2014 be the first to share yours.'; list.parentNode.insertBefore(empty,list.nextSibling); }
  const show=()=>{ R.renderReviewsInto({grid:list,empty:empty,summary:sum,verified:productReviewsCache||[],pending:productPendingReviews}); };
  if(productReviewsCache){ show(); }
  else{
    R.fetchApprovedReviews().then(all=>{
      productReviewsCache=all.filter(x=>String(x.productId||'')===String(p.id||p.sku||'')||String(x.productName||'')===String(p.name||''));
      show();
    });
  }
  const stars=[...document.querySelectorAll('#starRating .star')];
  stars.forEach(st=>st.addEventListener('click',()=>{
    productReviewRating=Number(st.dataset.value)||0;
    stars.forEach(x=>x.classList.toggle('active',Number(x.dataset.value)<=productReviewRating));
  }));
  const form=document.getElementById('reviewForm');
  if(form) form.addEventListener('submit',e=>{
    e.preventDefault();
    const msg=document.getElementById('reviewMessage');
    const name=document.getElementById('reviewName').value.trim();
    const comment=document.getElementById('reviewComment').value.trim();
    if(!productReviewRating){ msg.textContent='Please choose a star rating first.'; return; }
    if(!name||!comment){ msg.textContent='Please enter your name and write your review.'; return; }
    const btn=form.querySelector('.review-submit'); btn.disabled=true; btn.textContent='SUBMITTING...';
    R.submitReview({name:name,city:(document.getElementById('reviewCity')||{}).value||'',productId:p.id||p.sku,productName:p.name,rating:productReviewRating,comment:comment}).then(saved=>{
      productPendingReviews.unshift({...saved,status:'pending'});
      form.reset(); productReviewRating=0; stars.forEach(x=>x.classList.remove('active'));
      msg.textContent='Thank you! Your review is awaiting verification and will appear once approved.';
      btn.disabled=false; btn.textContent='SUBMIT REVIEW';
      show();
    }).catch(err=>{ btn.disabled=false; btn.textContent='SUBMIT REVIEW'; msg.textContent=err.message||'Could not save your review. Please try again.'; });
  });
}

<style>

<script>
/* PROFESSIONAL FEATURES (2026-11-25) — product page additions.
   render() rebuilds #app on every change (card/qty), so the boxes below are
   re-injected by a MutationObserver whenever they are wiped. Nothing here
   changes a price, a name, or the existing zoom/gallery behaviour. */
(function () {
  'use strict';
  var ICON_TRUCK = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 4h13v12h-13z"/><path d="M14.5 9h4l3 3v4h-7z"/><circle cx="6" cy="18.5" r="1.8"/><circle cx="17.5" cy="18.5" r="1.8"/></svg>';
  var ICON_HEART = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.3 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.7-3.5 6.9-8.5 10.9z"/></svg>';
  var ICON_HEART_FILL = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.3 3.5 9.6 3.5 7 5.5 5 8 5c1.6 0 3.1.8 4 2.1C12.9 5.8 14.4 5 16 5c2.5 0 4.5 2 4.5 4.6 0 3.7-3.5 6.9-8.5 10.9z"/></svg>';
  var ICON_RETURN = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';
  var ICON_CARD = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></svg>';

  function getProduct() {
    try { return (typeof p !== 'undefined' && p) ? p : null; } catch (e) { return null; }
  }
  function money(n) { return 'Rs. ' + Number(n || 0).toLocaleString('en-PK'); }
  function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function isFrameProduct(prod) {
    var sku = String((prod && prod.sku) || (typeof id !== 'undefined' ? id : ''));
    var name = (document.querySelector('.details h1') || {}).textContent || '';
    return /^GW-FW-/i.test(sku) || /frame|mirror/i.test(name);
  }

  /* --- Dynamic SEO: title/meta/OG/JSON-LD from the loaded product --- */
  var seoDone = false;
  function applySEO() {
    var prod = getProduct();
    if (!prod || seoDone) return;
    seoDone = true;
    var desc = (prod.description || 'A personalised GiftWALA gift — made to order in Pakistan.').slice(0, 155);
    var img = (Array.isArray(prod.images) && prod.images[0]) || prod.imageUrl || ('/assets/products/' + prod.sku + '.png');
    var set = function (el, attr, val) { if (el) el.setAttribute(attr, val); };
    set(document.getElementById('metaDesc'), 'content', desc);
    set(document.getElementById('ogTitle'), 'content', prod.name + ' | GiftWALA');
    set(document.getElementById('ogDesc'), 'content', desc);
    set(document.getElementById('ogUrl'), 'content', location.href);
    set(document.getElementById('ogImage'), 'content', img.indexOf('http') === 0 ? img : location.origin + img);
    var ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org', '@type': 'Product',
      name: prod.name, description: prod.description || undefined,
      image: img.indexOf('http') === 0 ? img : location.origin + img,
      sku: prod.sku, category: prod.category,
      brand: { '@type': 'Brand', name: 'GiftWALA' },
      offers: {
        '@type': 'Offer', url: location.href, priceCurrency: 'PKR',
        price: Number(prod.salePrice || prod.price || 0),
        availability: Number(prod.stock || 0) > 0 ? 'https://schema.org/InStock' : 'https://schema.org/OutOfStock'
      }
    });
    document.head.appendChild(ld);
  }

  /* --- Delivery + returns box (honest wording only) ---
     "Delivery in 2-5 working days" is NOT stated anywhere in the repo, so it
     is NOT used here. Delivery-returns.html says timing is confirmed on
     WhatsApp — that is what this box says. TODO (owner): confirm a real
     delivery-time promise, then this box can state it. */
  function injectDeliveryBox() {
    var d = document.querySelector('.details');
    if (!d || d.querySelector('.gw-delivery-box')) return;
    var box = document.createElement('div');
    box.className = 'gw-delivery-box';
    box.innerHTML =
      '<div class="gw-row">' + ICON_TRUCK + '<span><b>Delivery across Pakistan</b> — timing is confirmed with you on WhatsApp when you order.</span></div>' +
      '<div class="gw-row">' + ICON_CARD + '<span><b>Delivery Rs. 300 per order</b> · Cash on Delivery available · Prepaid orders get 15% off.</span></div>' +
      '<div class="gw-row">' + ICON_RETURN + '<span><b>Returns:</b> personalised items can&rsquo;t be returned for a change of mind. Damaged, defective or wrong item? We replace or refund — see <a href="/delivery-returns.html">Delivery &amp; Returns</a> or the <a href="/faq.html">FAQ</a>.</span></div>';
    var anchor = d.querySelector('#share') || d.querySelector('#wa') || d.querySelector('.total');
    if (anchor && anchor.parentNode) anchor.after(box);
    else d.appendChild(box);
  }

  /* --- Size selector, ONLY where the product has sizes ---
     Frame/mirror products already get their size selector from the existing
     frame scripts (which read the same p.sizes) — this skips them so the
     selector is never shown twice. There is no colour field in the catalogue
     API, so no colour selector is invented. TODO (owner): add colours to the
     catalogue if colour choice is needed. */
  function injectSizeSelector() {
    var prod = getProduct();
    var d = document.querySelector('.details');
    if (!prod || !d || d.querySelector('.gw-size-section') || d.querySelector('.frame-size-section')) return;
    if (isFrameProduct(prod)) return;
    var sizes = Array.isArray(prod.sizes) ? prod.sizes.map(function (s) { return typeof s === 'string' ? s : (s && s.label ? s.label : String(s)); }) : [];
    if (!sizes.length) return;
    if (!window.giftwalaSelectedSize) window.giftwalaSelectedSize = sizes[0];
    var box = document.createElement('div');
    box.className = 'section gw-size-section';
    box.innerHTML = '<p class="label">Choose a size</p><div class="options">' +
      sizes.map(function (s, i) { return '<button type="button" class="option ' + (s === window.giftwalaSelectedSize ? 'active' : '') + '" data-size="' + esc(s) + '">' + esc(s) + '</button>'; }).join('') +
      '</div>';
    box.querySelectorAll('[data-size]').forEach(function (b) {
      b.onclick = function () {
        window.giftwalaSelectedSize = b.dataset.size;
        box.querySelectorAll('[data-size]').forEach(function (x) { x.classList.toggle('active', x === b); });
      };
    });
    var note = Array.prototype.slice.call(d.querySelectorAll('.section')).find(function (x) { return /gift note/i.test(x.textContent); });
    if (note) note.before(box); else d.appendChild(box);
  }

  /* --- Wishlist button on the product page --- */
  function injectWishlistBtn() {
    var prod = getProduct();
    var d = document.querySelector('.details');
    if (!prod || !d || d.querySelector('.gw-wishlist-btn')) return;
    var wa = d.querySelector('#wa');
    if (!wa) return;
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'secondary gw-wishlist-btn';
    var refreshLabel = function () {
      var on = false;
      try { on = window.GiftwalaWishlist ? window.GiftwalaWishlist.has(prod.sku || prod.id) : (JSON.parse(localStorage.getItem('giftwalaWishlist') || '[]').some(function (x) { return String(x.id) === String(prod.sku || prod.id); })); } catch (e) {}
      btn.innerHTML = (on ? ICON_HEART_FILL : ICON_HEART) + (on ? 'Saved in wishlist' : 'Save to wishlist');
    };
    btn.onclick = function () {
      var item = { id: prod.sku || prod.id, sku: prod.sku, name: prod.name, price: Number(prod.salePrice || prod.price || 0), imageUrl: (Array.isArray(prod.images) && prod.images[0]) || prod.imageUrl || ('/assets/products/' + prod.sku + '.png') };
      if (window.GiftwalaWishlist) window.GiftwalaWishlist.toggle(item);
      else { try { var l = JSON.parse(localStorage.getItem('giftwalaWishlist') || '[]'); var i = l.findIndex(function (x) { return String(x.id) === String(item.id); }); if (i >= 0) l.splice(i, 1); else l.push(item); localStorage.setItem('giftwalaWishlist', JSON.stringify(l)); } catch (e) {} }
      refreshLabel();
    };
    refreshLabel();
    wa.after(btn);
  }

  /* --- Stock dot colour + lazy thumbnails --- */
  function polish() {
    var stock = document.querySelector('.stock');
    if (stock) {
      var dot = stock.querySelector('.stock-dot');
      if (dot && /unavailable/i.test(stock.textContent)) dot.style.background = '#a33';
    }
    document.querySelectorAll('.thumb img').forEach(function (img) { if (!img.loading) img.loading = 'lazy'; });
  }

  /* --- Related products (same category, real catalogue images) --- */
  var relatedDone = false;
  function loadRelated() {
    var prod = getProduct();
    if (!prod || relatedDone) return;
    relatedDone = true;
    var cat = prod.category || '';
    fetch('/api/products' + (cat ? '?category=' + encodeURIComponent(cat) : ''))
      .then(function (r) { return r.json(); })
      .then(function (list) {
        if (!Array.isArray(list)) return;
        var rel = list.filter(function (x) { return String(x.sku) !== String(prod.sku); }).slice(0, 4);
        if (!rel.length) return;
        var shell = document.querySelector('main.shell');
        if (!shell || document.getElementById('relatedProducts')) return;
        var sec = document.createElement('section');
        sec.className = 'related-products';
        sec.id = 'relatedProducts';
        sec.innerHTML = '<h2>You may also like</h2><p>More from ' + esc(cat || 'the GiftWALA collection') + '.</p><div class="related-grid">' +
          rel.map(function (x) {
            var img = x.imageUrl || ('/assets/products/' + x.sku + '.png');
            return '<article class="related-card product-card" data-product-id="' + esc(x.sku) + '" data-sku="' + esc(x.sku) + '" onclick="location.href=\'/product.html?id=' + encodeURIComponent(x.sku) + '\'">' +
              '<div class="related-img product-image"><img loading="lazy" decoding="async" src="' + esc(img) + '" alt="' + esc(x.name) + '" onerror="this.onerror=null;this.src=\'/assets/products/' + esc(x.sku) + '.png\'"></div>' +
              '<h3>' + esc(x.name) + '</h3><span class="related-price">' + money(Number(x.salePrice || x.price || 0)) + '</span></article>';
          }).join('') + '</div>';
        shell.appendChild(sec);
      })
      .catch(function () { /* Related products are a bonus — a failed fetch leaves the page as it was. */ });
  }

  function run() {
    applySEO();
    injectDeliveryBox();
    injectSizeSelector();
    injectWishlistBtn();
    polish();
    loadRelated();
  }
  var app = document.getElementById('app');
  if (app) new MutationObserver(function () { setTimeout(run, 0); }).observe(app, { childList: true, subtree: true });
  setInterval(run, 500);
  run();
})();
</script>
<style>
/* ---- Round 15 (2026-11-26) ----
   (1) WhatsApp float glyph dead-centre: ONE canonical rule — 62px circle,
       flexbox centring (align + justify), padding 0, gap 0, 34px glyph as a
       block svg with equal margins. The old pill / 46px / 48px / grid rules
       are removed from styles.css so nothing can shift it again.
   (2) Header: logo dead-centre on its own row position — grid: logo centred, wishlist/bag/theme icons right; main nav on its
       own centred row underneath. (3) Phones: logo on its own centred row,
