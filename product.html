<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftWALA Product</title><link rel="icon" href="/assets/giftwala-favicon-512.png"><style>body{margin:0;background:#f9f6f0;color:#171513;font:14px Arial}.shell{max-width:1200px;margin:auto;padding:35px 22px}.product{display:grid;grid-template-columns:1.05fr .95fr;gap:60px}.hero{aspect-ratio:1;background:#211b15;border-radius:14px;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}.thumbs{display:flex;gap:10px;margin-top:12px;overflow:auto}.thumb{width:70px;height:70px;padding:0;border:2px solid #ded4c4;background:#211b15;border-radius:8px;overflow:hidden;flex:none}.thumb.active{border-color:#c58f31}.thumb img{width:100%;height:100%;object-fit:cover}.eyebrow{color:#9a6c23;text-transform:uppercase;font-size:11px;font-weight:bold;letter-spacing:.18em;margin:8px 0 12px}.details h1{font:600 clamp(32px,4vw,48px)/1.1 Georgia;margin:0 0 16px}.subtitle{color:#716f69;line-height:1.65}.pricebox,.total{display:flex;justify-content:space-between;align-items:center;border-block:1px solid #e7e1d6;padding:18px 0;margin-top:22px}.price{font-size:28px;font-weight:bold}.old{font-size:14px;color:#999}.stock{color:#2e7453;font-size:12px;font-weight:bold}.section{padding-top:22px}.label{font-weight:bold;margin:0 0 7px}.help{font-size:12px;color:#716f69}.field{width:100%;padding:13px;border:1px solid #ded4c4;background:#fffdfa;box-sizing:border-box;border-radius:8px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.option{padding:12px 5px;border:1px solid #ded4c4;background:#fffdfa;border-radius:8px}.option.active{border:2px solid #bd8528;background:#fbf1db}.split{display:flex;gap:12px;align-items:end}.split>div:first-child{flex:1}.qty{display:flex;height:44px;border:1px solid #ded4c4;background:#fffdfa;border-radius:8px;overflow:hidden}.qty button{width:36px;border:0;background:none;font-size:18px}.qty span{width:28px;text-align:center;padding-top:13px}.total strong{font-size:21px}.primary,.secondary{width:100%;padding:15px;margin-top:14px;border-radius:8px;font-weight:bold;cursor:pointer}.primary{border:0;background:#d6a646}.secondary{border:1px solid #bca47a;background:transparent}.below{margin-top:50px;border-top:1px solid #e7e1d6;padding-top:22px}.below h2{font:28px Georgia}.below p{color:#716f69;line-height:1.7}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#211b15;color:#fff;padding:12px 18px;border-radius:8px}@media(max-width:800px){.product{grid-template-columns:1fr;gap:28px}.options{grid-template-columns:repeat(2,1fr)}.shell{padding:20px 16px}}
</style></head><body><main class="shell"><p><a href="/">← Back to collection</a></p><div id="app">Loading product...</div></main><div id="toast" class="toast"></div><script>const id=new URLSearchParams(location.search).get('id'),money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');let p,qty=1,card='';const toast=t=>{const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)};const imgs=()=>Array.isArray(p.images)&&p.images.length?p.images:[p.imageUrl||'/assets/products/'+p.sku+'.png'];function render(){const im=imgs(),base=Number(p.salePrice||p.price||0);document.title=p.name+' | GiftWALA';document.getElementById('app').innerHTML='<div class="product"><div><div class="hero"><img id="hero" src="'+im[0]+'" alt="'+p.name+'"></div><div class="thumbs">'+im.map((x,i)=>'<button class="thumb '+(!i?'active':'')+'" data-i="'+i+'"><img src="'+x+'"></button>').join('')+'</div></div><div class="details"><div class="eyebrow">'+(p.category||'GiftWALA collection')+'</div><h1>'+p.name+'</h1><p class="subtitle">'+(p.description||'A thoughtful GiftWALA pick, personalised and packed with care.')+'</p><div class="pricebox"><span class="price">'+money(base)+' '+(p.salePrice?'<del class="old">'+money(p.price)+'</del>':'')+'</span><span class="stock">● '+(Number(p.stock||0)>0?'In stock':'Currently unavailable')+'</span></div><div class="section"><p class="label">Personalization name</p><p class="help">Enter the name exactly as you want it printed.</p><input id="person" class="field" placeholder="e.g. Fahad Mustafa"></div><div class="section"><p class="label">Choose an occasion card (+ Rs. 50)</p><div class="options">'+['Birthday','Anniversary','Wedding','Eid / Islamic','Thank you','Love / Friendship'].map(x=>'<button class="option '+(x===card?'active':'')+'" data-card="'+x+'">'+x+'</button>').join('')+'</div></div><div class="section split"><div><p class="label">Gift note (optional)</p><input id="note" class="field" placeholder="A short message"></div><div><p class="label">Quantity</p><div class="qty"><button id="minus">−</button><span>'+qty+'</span><button id="plus">+</button></div></div></div><div class="total"><span>Estimated total</span><strong>'+money((base+(card?50:0))*qty)+'</strong></div><button class="primary" id="add">ADD TO CART →</button><button class="secondary" id="wa">ASK ON WHATSAPP ↗</button></div></div><section class="below"><h2>Made personal, made memorable.</h2><p>'+(p.description||'Review your personalization details before placing an order.')+'</p></section>';document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{document.getElementById('hero').src=im[b.dataset.i];document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{card=card===b.dataset.card?'':b.dataset.card;render()});document.getElementById('minus').onclick=()=>{qty=Math.max(1,qty-1);render()};document.getElementById('plus').onclick=()=>{qty=Math.min(99,qty+1);render()};document.getElementById('add').onclick=()=>{const c=JSON.parse(localStorage.getItem('giftwalaCart')||'[]');c.push({id:p.id||p.sku,sku:p.sku,name:p.name,price:base,qty,imageUrl:im[0],occasion:card,note:document.getElementById('note').value});localStorage.setItem('giftwalaCart',JSON.stringify(c));localStorage.setItem('giftwala_checkout_cart',JSON.stringify(c));toast('Added to cart')};document.getElementById('wa').onclick=()=>window.open('https://wa.me/923010746622?text='+encodeURIComponent('Hi GiftWALA! I would like to order: '+p.name+'\n'+location.href),'_blank')}async function load(){const r=await fetch('/api/products/'+encodeURIComponent(id));if(!r.ok)return; p=await r.json();render()}load();</script></body></html>
