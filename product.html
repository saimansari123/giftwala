</style></head><body><main class="shell"><p><a href="/">← Back to collection</a></p><div id="app">Loading product...</div></main><div id="toast" class="toast"></div><script>const id=new URLSearchParams(location.search).get('id'),money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK');let p,qty=1,card='';const toast=t=>{const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2400)};const imgs=()=>Array.isArray(p.images)&&p.images.length?p.images:[p.imageUrl||'/assets/products/'+p.sku+'.png'];function render(){const im=imgs(),base=Number(p.salePrice||p.price||0);document.title=p.name+' | GiftWALA';document.getElementById('app').innerHTML='<div class="product"><div><div class="hero"><img id="hero" src="'+im[0]+'" alt="'+p.name+'"></div><div class="thumbs">'+im.map((x,i)=>'<button class="thumb '+(!i?'active':'')+'" data-i="'+i+'"><img src="'+x+'"></button>').join('')+'</div></div><div class="details"><div class="eyebrow">'+(p.category||'GiftWALA collection')+'</div><h1>'+p.name+'</h1><p class="subtitle">'+(p.description||'A thoughtful GiftWALA pick, personalised and packed with care.')+'</p><div class="pricebox"><span class="price">'+money(base)+' '+(p.salePrice?'<del class="old">'+money(p.price)+'</del>':'')+'</span><span class="stock">● '+(Number(p.stock||0)>0?'In stock':'Currently unavailable')+'</span></div><div class="section"><p class="label">Personalization name</p><p class="help">Enter the name exactly as you want it printed.</p><input id="person" class="field" placeholder="e.g. Fahad Mustafa"></div><div class="section"><p class="label">Choose an occasion card (+ Rs. 50)</p><div class="options">'+['Birthday','Anniversary','Wedding','Eid / Islamic','Thank you','Love / Friendship'].map(x=>'<button class="option '+(x===card?'active':'')+'" data-card="'+x+'">'+x+'</button>').join('')+'</div></div><div class="section split"><div><p class="label">Gift note (optional)</p><input id="note" class="field" placehol <script>(()=>{const showZoom=src=>{let modal=document.getElementById('zoomModal');if(!modal){modal=document.createElement('div');modal.id='zoomModal';modal.className='zoom-modal';modal.innerHTML='<div class="zoom-modal-content"><button class="close-zoom">×</button><img class="zoom-modal-img" src="'+src+'"><div class="zoom-controls"><button class="zoom-control-btn" id="zoomIn">+</button><button class="zoom-control-btn" id="zoomOut">−</button></div></div>';document.body.appendChild(modal);const img=modal.querySelector('.zoom-modal-img');let scale=1;modal.querySelector('.close-zoom').onclick=()=>modal.classList.remove('active');modal.querySelector('#zoomIn').onclick=()=>{if(scale>=3)return;scale+=.5;img.style.transform='scale('+scale+')';img.classList.add('zoomed')};modal.querySelector('#zoomOut').onclick=()=>{if(scale<=1)return;scale-=.5;img.style.transform='scale('+scale+')';if(scale<=1)img.classList.remove('zoomed')};img.onclick=()=>{scale=scale>1?1:2;img.style.transform='scale('+scale+')';img.classList.toggle('zoomed',scale>1)};modal.onclick=e=>{if(e.target===modal)modal.classList.remove('active')}}modal.classList.add('active')};const setupZoom=()=>{const hero=document.getElementById('hero');if(!hero||hero.dataset.zoomReady)return;hero.dataset.zoomReady='1';hero.style.cursor='zoom-in';hero.onclick=()=>showZoom(hero.src)};const app=document.getElementById('app');if(app)new MutationObserver(()=>setTimeout(setupZoom,0)).observe(app,{childList:true,subtree:true});setInterval(setupZoom,250);let zoomBtn=document.querySelector('.zoom-btn');if(!zoomBtn){const hero=document.getElementById('hero');if(hero){zoomBtn=document.createElement('button');zoomBtn.className='zoom-btn';zoomBtn.innerHTML='🔍';zoomBtn.onclick=e=>{e.preventDefault();e.stopPropagation();showZoom(hero.src)};hero.parentElement?.appendChild(zoomBtn)}}})();</script>
<script>(()=>{const watch=()=>{const t=document.querySelector('.product .total strong');if(!t||t.dataset.amountWatch)return;t.dataset.amountWatch='1';new MutationObserver(()=>{t.classList.remove('total-updated');void t.offsetWidth;t.classList.add('total-updated')}).observe(t,{childList:true,characterData:true,subtree:true})};setInterval(watch,250)})();</script>

<script>(()=>{const sizes=[['A5','5.5 x 8 inches',799],['A4','8.25 x 11.74 inches',1199],['A3','11.5 x 16.5 inches',1599]];const apply=()=>{const box=document.querySelector('.frame-size-section');if(!box)return;box.querySelectorAll('[data-size]').forEach((b,i)=>{const x=sizes[i];if(!x)return;b.dataset.size=x[1];b.dataset.price=x[2];b.textContent=x[0]+' — '+x[1]+' — Rs. '+x[2].toLocaleString('en-PK');if(!b.dataset.priceReady)b.onclick=()=>{box.querySelectorAll('[data-size]').forEach(y=>y.classList.toggle('active',y===b));const t=document.querySelector('.total strong');if(t)t.textContent='Rs. '+x[2].toLocaleString('en-PK')};b.dataset.priceReady='1'})};setInterval(apply,250)})();</script>
<script>(()=>{const sizes=[['A5','5.5 x 8 inches',799],['A4','8.25 x 11.74 inches',1199],['A3','11.5 x 16.5 inches',1599]];const apply=()=>{const box=document.querySelector('.frame-size-section');if(!box)return;box.querySelectorAll('[data-size]').forEach((b,i)=>{const x=sizes[i];if(!x)return;b.textContent=x[0]+' ('+x[1]+')';b.dataset.price=x[2];b.onclick=()=>{box.querySelectorAll('[data-size]').forEach(y=>y.classList.toggle('active',y===b));const t=document.querySelector('.total strong');if(t)t.textContent='Rs. '+x[2].toLocaleString('en-PK')}})};setInterval(apply,250)})();</script>
<script>(()=>{const sizes=[['A5','5.5 x 8 inches',799],['A4','8.25 x 11.74 inches',1199],['A3','11.5 x 16.5 inches',1599]];let ready=false;const apply=()=>{const box=document.querySelector('.frame-size-section');if(!box)return;box.querySelectorAll('[data-size]').forEach((b,i)=>{const x=sizes[i];if(!x)return;const text=x[0]+' ('+x[1]+')';if(b.textContent!==text)b.textContent=text;b.dataset.price=x[2]});if(!ready){ready=true;box.addEventListener('click',e=>{const b=e.target.closest('[data-size]');if(!b)return;const x=sizes[[...box.querySelectorAll('[data-size]')].indexOf(b)];if(!x)return;requestAnimationFrame(()=>{const t=document.querySelector('.total strong');if(t)t.textContent='Rs. '+x[2].toLocaleString('en-PK');const p=document.querySelector('.price');if(p)p.firstChild.textContent='Rs. '+x[2].toLocaleString('en-PK')})},true)}};setInterval(apply,250)})();</script><script>let reviewsInitialized=false;const initReviews=()=>{if(reviewsInitialized)return false;const form=document.getElementById('reviewForm'),list=document.getElementById('reviewsList'),msg=document.getElementById('reviewMessage'),nameInput=document.getElementById('reviewName'),commentInput=document.getElementById('reviewComment'),ratingDiv=document.getElementById('starRating');if(!form||!list||!msg||!nameInput||!commentInput||!ratingDiv)return false;reviewsInitialized=true;let rating=0;const stars=[...ratingDiv.querySelectorAll('.star')];const updateStars=()=>{stars.forEach((s,i)=>{i<rating?s.classList.add('active'):s.classList.remove('active')})};stars.forEach((star,idx)=>{star.onclick=e=>{e.preventDefault();e.stopPropagation();rating=idx+1;updateStars()}});fetch('/api/reviews').then(r=>r.ok?r.json():[]).then(reviews=>{if(!Array.isArray(reviews))return;reviews.reverse().forEach(x=>{if(!list.querySelector('[data-review-id="'+x.id+'"]')){const article=document.createElement('article');article.dataset.reviewId=x.id;const strs='★'.repeat(Math.max(1,Math.min(5,x.rating||5)));article.innerHTML=strs+'<h3>"'+String(x.comment).replace(/[<>]/g,'')+'"</h3><b>'+String(x.name).replace(/[<>]/g,'')+' · '+x.rating+'/5</b>';list.appendChild(article)}})}).catch(()=>{});form.addEventListener('submit',e=>{e.preventDefault();if(!rating){msg.textContent='Please select a rating';msg.style.color='#d6464e';return}const n=nameInput.value.trim(),c=commentInput.value.trim();if(!n||!c){msg.textContent='Please fill all fields';msg.style.color='#d6464e';return}const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Submitting...';fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,comment:c,rating,productId:id,productName:window.p?.name})}).then(r=>{if(!r.ok)throw new Error(r.statusText);const article=document.createElement('article');const strs='★'.repeat(rating);article.innerHTML=strs+'<h3>"'+c.replace(/[<>]/g,'')+'"</h3><b>'+n.replace(/[<>]/g,'')+' · '+rating+'/5</b>';list.insertBefore(article,list.firstChild);nameInput.value='';commentInput.value='';rating=0;updateStars();const modal=document.createElement('div');modal.className='review-success-modal';modal.innerHTML='<div class="review-success-box"><div class="check">✓</div><h2>Review Submitted!</h2><p>Thank you for sharing your experience with us.</p><button onclick="this.closest(\".review-success-modal\").remove()" style="margin-top:20px;padding:12px 24px;background:#d6a646;border:0;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff">Close</button></div>';document.body.appendChild(modal);setTimeout(()=>{if(modal.parentElement)modal.remove()},5000)}).catch(err=>{msg.textContent='Error: '+(err.message||'Please try again');msg.style.color='#d6464e'}).finally(()=>{btn.disabled=false;btn.textContent='SUBMIT REVIEW'})});return true};setInterval(initReviews,200);</script>
