<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | GiftWALA</title><link rel="icon" type="image/png" href="/assets/giftwala-favicon-512.png"><style>
:root{--gold:#e5aa3c;--ink:#171513;--cream:#fffaf2;--line:#e6d9c8}*{box-sizing:border-box}body{margin:0;background:#41394b;color:var(--ink);font:14px Arial,sans-serif}.wrap{max-width:1100px;margin:28px auto;background:var(--cream);min-height:calc(100vh - 56px)}header{background:#100e0b;color:#fff;padding:22px 32px;display:flex;align-items:center;justify-content:space-between}header a{color:#f3c35d;text-decoration:none}.brand{font:bold 25px Georgia;color:#fff}.brand span{color:var(--gold)}main{padding:36px;display:grid;grid-template-columns:1.2fr .8fr;gap:30px}.card{background:#fff;padding:26px;border:1px solid var(--line)}h1,h2{font-family:Georgia,serif;margin:0 0 20px}h1{font-size:34px}h2{font-size:24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:11px;font-weight:bold;color:#705b3a;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid var(--line);background:#fffaf2;font:inherit}.field textarea{min-height:85px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.item img{width:64px;height:64px;object-fit:cover;background:#eee}.item strong{display:block}.muted{color:#817970;font-size:12px;margin-top:5px}.summary{display:flex;justify-content:space-between;margin:14px 0}.total{font-size:20px;font-weight:bold;border-top:1px solid var(--line);padding-top:16px}.discount{color:#27724d;font-size:12px}.submit{width:100%;border:0;background:var(--gold);padding:15px;font-weight:bold;cursor:pointer;margin-top:15px}.empty{text-align:center;padding:40px;color:#817970}@media(max-width:760px){.wrap{margin:0;min-height:100vh}header{padding:18px}.brand{font-size:21px}main{padding:20px;display:block}.card{margin-bottom:18px}.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header><div class="brand">Gift<span>WALA</span></div><a href="/">← Continue shopping</a></header><main><section class="card"><h1>Complete your order</h1><form id="checkoutForm"><div class="row"><div class="field"><label>Name *</label><input id="name" required></div><div class="field"><label>WhatsApp *</label><input id="phone" inputmode="numeric" pattern="03[0-9]{9}" maxlength="11" required></div></div><div class="row"><div class="field"><label>Occasion</label><select id="occasion"><option>Birthday</option><option>Anniversary</option><option>Wedding</option><option>Eid / Islamic</option><option>Other</option></select></div><div class="field"><label>Payment method</label><select id="payment"><option>Cash on Delivery</option><option>Easypaisa - 15% off prepaid</option><option>JazzCash - 15% off prepaid</option><option>Bank Transfer - 15% off prepaid</option></select></div></div><div class="field"><label>Delivery address *</label><textarea id="address" required></textarea></div><div class="field"><label>Gift message</label><textarea id="message"></textarea></div><button class="submit" id="submit">Place order via WhatsApp</button><p class="muted">We will confirm your order and delivery details on WhatsApp.</p></form></section><aside class="card"><h2>Your order</h2><div id="items"></div><div class="summary"><span>Products subtotal</span><strong id="subtotal">Rs. 0</strong></div><div class="summary discount"><span>Prepaid discount</span><strong id="discount">Rs. 0</strong></div><div class="summary"><span>Delivery charges</span><strong>Rs. 250</strong></div><div class="summary total"><span>Final total</span><strong id="total">Rs. 250</strong></div></aside></main></div><script>
const cart=JSON.parse(localStorage.getItem('giftwala_checkout_cart')||'[]'),money=n=>'Rs. '+Number(n||0).toLocaleString('en-PK'),items=document.getElementById('items'),sub=document.getElementById('subtotal'),discount=document.getElementById('discount'),total=document.getElementById('total'),payment=document.getElementById('payment');let base=cart.reduce((s,x)=>s+Number(x.price||0)*Number(x.qty||1),0);function refresh(){const pre=payment.value!=='Cash on Delivery',save=pre?Math.round(base*.15):0;sub.textContent=money(base);discount.textContent=save?'− '+money(save):'Rs. 0';total.textContent=money(base-save+250)}items.innerHTML=cart.length?cart.map(x=>`<div class="item"><img src="${x.imageUrl||'/assets/brand/giftwala-favicon-512.png'}"><div><strong>${x.name||'Gift item'}</strong><div class="muted">Qty ${x.qty||1} · ${money(Number(x.price||0)*(x.qty||1))}</div></div></div>`).join(''):'<div class="empty">Your bag is empty.</div>';payment.onchange=refresh;refresh();document.getElementById('checkoutForm').onsubmit=async e=>{e.preventDefault();if(!cart.length)return alert('Your bag is empty.');const pre=payment.value!=='Cash on Delivery',save=pre?Math.round(base*.15):0,grand=base-save+250, val=id=>document.getElementById(id).value.trim(),lines=cart.map((x,i)=>(i+1)+'. '+x.name+' | Qty: '+(x.qty||1)+' | '+money(Number(x.price||0)*(x.qty||1))+(x.occasion?' | Occasion: '+x.occasion:'')+(x.note?' | Customisation: '+x.note:'')+' | Link: '+location.origin+'/product.html?id='+encodeURIComponent(x.sku||x.id)).join('\n'),msg='*NEW GIFTWALA ORDER*\n\n*Order items:*\n'+lines+'\n\n*Customer details:*\nName: '+val('name')+'\nWhatsApp: '+val('phone')+'\nOccasion: '+val('occasion')+'\nGift message: '+val('message')+'\nDelivery address: '+val('address')+'\n\n*Bill details:*\nProducts subtotal: '+money(base)+'\nPayment method: '+payment.value+'\nDiscount: '+(save?'- '+money(save):'Rs. 0')+'\nDelivery charges: '+money(250)+'\n*Final total: '+money(grand)+'*';window.open('https://wa.me/923010746622?text='+encodeURIComponent(msg),'_blank')};
</script></body></html>
